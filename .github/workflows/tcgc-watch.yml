name: TCGC version check
on:
  push:
    branches: [replacement-tcgc-watch-01]
    paths: [.github/tcgc-ready]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: tcgc-watch
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'mohanad-hafez/typespec-version-watch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check version rules
        run: node --test .github/scripts/tcgc_watch.test.mjs
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {watchTcgc}=await import(process.env.GITHUB_WORKSPACE+'/.github/scripts/tcgc_watch.mjs');
            await watchTcgc({github,context});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tcgc-evidence
          path: tcgc-evidence/
          retention-days: 7
